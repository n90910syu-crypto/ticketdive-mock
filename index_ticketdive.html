<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>整理番号入力</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Hiragino Sans", "Hiragino Kaku Gothic ProN",
                   Arial, sans-serif;
      background: #f7f7f7;
      padding: 24px;
    }

    .box {
      max-width: 420px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    h2 {
      font-size: 20px;
      margin-bottom: 16px;
      text-align: center;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      font-size: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .btn {
      display: block;
      width: 100%;
      height: 48px;
      border-radius: 999px;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      line-height: 48px;
      text-decoration: none;
      box-sizing: border-box;
    }

    .save {
      margin-top: 20px;
      background: #2d9cdb;
      color: #fff;
    }

    .link-area {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .link {
      flex: 1;
      background: #eee;
      color: #333;
    }

    .link.disabled {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
    }

    .note {
      margin-top: 14px;
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      text-align: center;
    }

    select {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      background: #fff;
    }

    .divider {
      margin: 24px 0;
      border: none;
      border-top: 1px solid #e2e2e2;
    }

    .fetch-btn {
      margin-top: 12px;
      background: #6c5ce7;
      color: #fff;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      background: #f7f7f7;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.7;
      color: #333;
      word-break: break-all;
      display: none;
    }

    .result-box.show {
      display: block;
    }

    .result-box img {
      max-width: 100%;
      border-radius: 8px;
      margin-top: 8px;
    }

    .status-text {
      white-space: pre-line;
      margin-top: 10px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }

    .picker-row {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .picker-row select {
      flex: 1;
      min-width: 60px;
      font-size: 15px;
      padding: 10px 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .picker-row span {
      font-size: 14px;
      color: #666;
      flex: none;
    }

    .picker-label {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 700;
      color: #555;
    }

    .invalid {
      border: 2px solid #e53935 !important;
      background: #fff5f5 !important;
    }

    .picker-btn {
      margin-top: 8px;
      background: #eee;
      color: #333;
      height: 40px;
      line-height: 40px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="box">

    <label for="userNameInput">氏名</label>

    <input id="userNameInput" type="text" placeholder="中村海斗">

    <hr class="divider">

    <label for="eventUrlInput">Ticket Dive イベントURL</label>

    <input id="eventUrlInput" type="text" placeholder="https://ticketdive.com/event/">

    <a href="javascript:void(0);" target="_blank" rel="noopener" class="btn link disabled" id="openEventUrlLink" style="margin-top:8px; display:block;">
      このURLを開く
    </a>

    <button type="button" class="btn fetch-btn" id="fetchBtn">
      イベント情報を取得
    </button>

    <p class="status-text" id="fetchStatus"></p>

    <label for="eventTitleInput" style="margin-top:16px;">イベントタイトル</label>
    <input id="eventTitleInput" type="text" placeholder="自動取得 or 手入力">

    <div id="stageRow" style="display:none;">
      <label for="stageSelect" style="margin-top:16px;">公演(日程)</label>
      <select id="stageSelect" style="margin-bottom:8px;"></select>
    </div>

    <label for="userGroupInput" style="margin-top:16px;">お目当てのグループ</label>
    <select id="groupSelect" style="display:none; margin-bottom:8px;">
      <option value="">-- 候補から選ぶ --</option>
    </select>
    <input id="userGroupInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventTicketTypeInput" style="margin-top:16px;">チケット種別</label>
    <select id="ticketTypeSelect" style="display:none; margin-bottom:8px;">
      <option value="">-- 候補から選ぶ --</option>
    </select>
    <input id="eventTicketTypeInput" type="text" placeholder="自動取得 or 手入力">

    <label for="userInput" style="margin-top:16px;">整理番号</label>
    <input id="userInput" type="text" placeholder="S-">

    <label for="eventDateInput" style="margin-top:16px;">日時</label>
    <input id="eventDateInput" type="text" placeholder="自動取得 or 手入力">

    <div class="picker-row">
      <select id="dateYearSelect"></select><span>年</span>
      <select id="dateMonthSelect"></select><span>月</span>
      <select id="dateDaySelect"></select><span>日</span>
    </div>
    <button type="button" class="btn picker-btn" id="dateApplyBtn">
      この日付を反映
    </button>

    <label for="eventShowtimeInput" style="margin-top:16px;">開場/開演</label>
    <input id="eventShowtimeInput" type="text" placeholder="自動取得 or 手入力">

    <div class="picker-label">開場</div>
    <div class="picker-row">
      <select id="openHourSelect"></select><span>:</span>
      <select id="openMinuteSelect"></select>
    </div>

    <div class="picker-label">開演</div>
    <div class="picker-row">
      <select id="startHourSelect"></select><span>:</span>
      <select id="startMinuteSelect"></select>
    </div>
    <button type="button" class="btn picker-btn" id="showtimeApplyBtn">
      この時刻を反映
    </button>

    <label for="eventImageInput" style="margin-top:16px;">画像URL</label>
    <input id="eventImageInput" type="text" placeholder="自動取得 or 手入力">

    <label for="eventVenueInput" style="margin-top:16px;">会場名</label>
    <input id="eventVenueInput" type="text" placeholder="自動取得 or 手入力">

    <div class="result-box show" id="resultBox">
      <img id="resultImage" src="" alt="" style="display:none;">
    </div>

    <hr class="divider">

    <button type="button" class="btn save" id="saveAllBtn">
      保存
    </button>

    <div class="link-area">
      <a href="ticketdive_mock.html" class="btn link disabled" id="goLink">
        GO
      </a>
    </div>







    <p class="note">
      ※必ず保存後に表示
    </p>
  </div>

  <script>
    const input = document.getElementById('userInput');
    const nameInput = document.getElementById('userNameInput');
    const groupInput = document.getElementById('userGroupInput');
    const groupSelect = document.getElementById('groupSelect');
    const stageRow = document.getElementById('stageRow');
    const stageSelect = document.getElementById('stageSelect');
    const goLink = document.getElementById('goLink');

    // 保存済みがあれば復元、なければ初期値(プレースホルダーと同じ)を表示
    function restore(el, key, fallback) {
      if (!el) return;
      const saved = localStorage.getItem(key);
      el.value = saved && saved.trim() !== '' ? saved : fallback;
    }

    restore(input, 'userInput', 'S-');
    restore(nameInput, 'userName', '中村海斗');
    // お目当てのグループは、イベントごとに候補が変わるので毎回空から始める

    // イベント情報欄は毎回リセット(ページを開き直したら空の状態から始める)

    // GOは常に「保存」を押すまで無効。ページを開き直した時点で毎回無効に戻す。

    // ==========================
    // Ticket Dive イベント情報の自動取得
    // ==========================
    const eventUrlInput = document.getElementById('eventUrlInput');
    const openEventUrlLink = document.getElementById('openEventUrlLink');
    const fetchBtn = document.getElementById('fetchBtn');
    const fetchStatus = document.getElementById('fetchStatus');
    const eventTitleInput = document.getElementById('eventTitleInput');
    const eventTicketTypeInput = document.getElementById('eventTicketTypeInput');
    const ticketTypeSelect = document.getElementById('ticketTypeSelect');
    const eventDateInput = document.getElementById('eventDateInput');
    const eventShowtimeInput = document.getElementById('eventShowtimeInput');
    const eventImageInput = document.getElementById('eventImageInput');
    const eventVenueInput = document.getElementById('eventVenueInput');
    const resultImage = document.getElementById('resultImage');
    const saveAllBtn = document.getElementById('saveAllBtn');

    const dateYearSelect = document.getElementById('dateYearSelect');
    const dateMonthSelect = document.getElementById('dateMonthSelect');
    const dateDaySelect = document.getElementById('dateDaySelect');
    const dateApplyBtn = document.getElementById('dateApplyBtn');

    const openHourSelect = document.getElementById('openHourSelect');
    const openMinuteSelect = document.getElementById('openMinuteSelect');
    const startHourSelect = document.getElementById('startHourSelect');
    const startMinuteSelect = document.getElementById('startMinuteSelect');
    const showtimeApplyBtn = document.getElementById('showtimeApplyBtn');

    // プルダウンに選択肢を詰める共通処理
    function fillSelectRange(select, start, end, pad) {
      for (let i = start; i <= end; i++) {
        const opt = document.createElement('option');
        const val = pad ? String(i).padStart(pad, '0') : String(i);
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      }
    }

    const nowForPicker = new Date();
    fillSelectRange(dateYearSelect, nowForPicker.getFullYear() - 1, nowForPicker.getFullYear() + 3, 0);
    fillSelectRange(dateMonthSelect, 1, 12, 2);
    fillSelectRange(dateDaySelect, 1, 31, 2);
    fillSelectRange(openHourSelect, 0, 23, 2);
    fillSelectRange(openMinuteSelect, 0, 59, 2);
    fillSelectRange(startHourSelect, 0, 23, 2);
    fillSelectRange(startMinuteSelect, 0, 59, 2);

    // プルダウンの初期選択を「今日・現在時刻」にしておく(2025/01/01のような不自然な初期値を避ける)
    dateYearSelect.value = String(nowForPicker.getFullYear());
    dateMonthSelect.value = String(nowForPicker.getMonth() + 1).padStart(2, '0');
    dateDaySelect.value = String(nowForPicker.getDate()).padStart(2, '0');
    openHourSelect.value = String(nowForPicker.getHours()).padStart(2, '0');
    openMinuteSelect.value = String(nowForPicker.getMinutes()).padStart(2, '0');
    startHourSelect.value = String(nowForPicker.getHours()).padStart(2, '0');
    startMinuteSelect.value = String(nowForPicker.getMinutes()).padStart(2, '0');

    const weekdayKanji = ['日', '月', '火', '水', '木', '金', '土'];

    // 選んだ日付をテキスト欄に反映(取得済みでも上書き可能)
    dateApplyBtn.addEventListener('click', function () {
      const y = Number(dateYearSelect.value);
      const m = Number(dateMonthSelect.value);
      const d = Number(dateDaySelect.value);
      const weekday = weekdayKanji[new Date(y, m - 1, d).getDay()];
      eventDateInput.value =
        dateYearSelect.value + '年' +
        dateMonthSelect.value + '月' +
        dateDaySelect.value + '日(' + weekday + ')';
      goLink.classList.add('disabled');
    });

    // 選んだ開場/開演時刻をテキスト欄に反映(取得済みでも上書き可能)
    showtimeApplyBtn.addEventListener('click', function () {
      eventShowtimeInput.value =
        '開場 ' + openHourSelect.value + ':' + openMinuteSelect.value +
        '／開演 ' + startHourSelect.value + ':' + startMinuteSelect.value;
      goLink.classList.add('disabled');
    });

    // <br>より前のテキストだけを取り出す(ネストしたdivや価格部分を除外)
    function extractLeadingText(el) {
      let text = '';
      for (const node of el.childNodes) {
        if (node.nodeName && node.nodeName.toLowerCase() === 'br') break;
        text += node.textContent || '';
      }
      return text.trim();
    }

    function updateImagePreview() {
      const url = eventImageInput.value.trim();
      if (url) {
        resultImage.src = url;
        resultImage.style.display = 'block';
      } else {
        resultImage.style.display = 'none';
      }
    }

    eventImageInput.addEventListener('input', updateImagePreview);
    updateImagePreview();

    // チケット種別ごとの整理番号の接頭辞(取得したときに分かる)。 チケット種別名 → 接頭辞
    let ticketPrefixMap = {};

    // 整理番号の「接頭辞」の部分だけを差し替える。番号の部分(S-34 の 34)はそのまま残す
    function applyPrefixToReference(prefix) {
      const cur = input.value.trim();
      let number = '';
      const i = cur.indexOf('-');
      if (i !== -1) {
        number = cur.slice(i + 1);
      } else {
        const m = /\d+$/.exec(cur);
        number = m ? m[0] : '';
      }
      input.value = prefix + '-' + number;
      goLink.classList.add('disabled');
    }

    // 今のチケット種別に対応する接頭辞が分かっていれば、整理番号に反映する
    function syncPrefixWithTicketType() {
      const name = eventTicketTypeInput.value.trim();
      if (Object.prototype.hasOwnProperty.call(ticketPrefixMap, name)) {
        applyPrefixToReference(ticketPrefixMap[name]);
      }
    }

    // ページに埋め込まれたデータ(__NEXT_DATA__)から、接頭辞(prefix)を持つ項目を集める
    function extractPrefixPairs(doc) {
      const pairs = [];
      const nd = doc.getElementById ? doc.getElementById('__NEXT_DATA__') : null;
      if (!nd) return pairs;
      let data;
      try { data = JSON.parse(nd.textContent); } catch (e) { return pairs; }
      const seen = new Set();
      (function walk(o) {
        if (!o || typeof o !== 'object') return;
        if (typeof o.prefix === 'string' && o.prefix.trim() !== '') {
          const name = typeof o.name === 'string' ? o.name.trim() : '';
          const key = (o.id || '') + '|' + name + '|' + o.prefix;
          if (!seen.has(key)) {
            seen.add(key);
            pairs.push({ name: name, prefix: o.prefix.trim() });
          }
        }
        (Array.isArray(o) ? o : Object.values(o)).forEach(walk);
      })(data);
      return pairs;
    }

    // 集めた接頭辞を、画面のチケット種別と対応付ける。
    //   ① 名前が同じもの同士を対応付ける
    //   ② 名前で対応付けられない場合、同じ並びが繰り返されているだけなら、並び順で対応付ける
    function buildPrefixMap(pairs, ticketNames) {
      const map = {};
      ticketNames.forEach(function (n) {
        const hit = pairs.find(function (p) { return p.name && p.name === n; });
        if (hit) map[n] = hit.prefix;
      });
      const n = ticketNames.length;
      if (Object.keys(map).length === 0 && n > 0 && pairs.length >= n && pairs.length % n === 0) {
        const periodic = pairs.every(function (p, i) { return p.prefix === pairs[i % n].prefix; });
        if (periodic) {
          ticketNames.forEach(function (name, i) { map[name] = pairs[i].prefix; });
        }
      }
      return map;
    }

    ticketTypeSelect.addEventListener('change', function () {
      if (ticketTypeSelect.value) {
        eventTicketTypeInput.value = ticketTypeSelect.value;
        goLink.classList.add('disabled');
        syncPrefixWithTicketType();      // チケット種別を変えたら、整理番号の接頭辞も自動で変える
      }
    });
    // 手入力でチケット種別名が完全に一致したときも同様に反映する
    eventTicketTypeInput.addEventListener('input', syncPrefixWithTicketType);

    groupSelect.addEventListener('change', function () {
      if (groupSelect.value) {
        groupInput.value = groupSelect.value;
        goLink.classList.add('disabled');
      }
    });

    // 入力されたURLへの「このURLを開く」リンクを更新
    function updateOpenEventUrlLink() {
      const url = eventUrlInput.value.trim();
      if (url) {
        openEventUrlLink.href = url;
        openEventUrlLink.classList.remove('disabled');
      } else {
        openEventUrlLink.href = 'javascript:void(0);';
        openEventUrlLink.classList.add('disabled');
      }
    }
    eventUrlInput.addEventListener('input', updateOpenEventUrlLink);
    updateOpenEventUrlLink();

    // ---- 公演(日程)が複数あるイベント(3日間開催など)への対応 ----
    // 取得した公演の一覧。1つの公演ぶんが { 日付, 開場・開演の時刻, 会場, 出演者の一覧 }
    let stagesData = [];

    function setDateFields(st) {
      const m = String(st.m).padStart(2, '0');
      const d = String(st.d).padStart(2, '0');
      const weekday = st.weekday || weekdayKanji[new Date(Number(st.y), Number(st.m) - 1, Number(st.d)).getDay()];
      eventDateInput.value = st.y + '年' + m + '月' + d + '日(' + weekday + ')';
      dateYearSelect.value = String(st.y);
      dateMonthSelect.value = m;
      dateDaySelect.value = d;
    }

    function setTimeFields(st) {
      const oh = String(st.oh).padStart(2, '0');
      const sh = String(st.sh).padStart(2, '0');
      eventShowtimeInput.value = '開場 ' + oh + ':' + st.om + '／開演 ' + sh + ':' + st.sm;
      openHourSelect.value = oh;
      openMinuteSelect.value = st.om;
      startHourSelect.value = sh;
      startMinuteSelect.value = st.sm;
    }

    // 選んだ公演の内容(日付・時刻・会場・出演者)を、画面の各欄に反映する
    function applyStage(i) {
      const result = { count: 0, multiArtists: false };
      const st = stagesData[i];
      if (!st) return result;

      setDateFields(st);
      result.count++;

      if (st.oh !== undefined) {
        setTimeFields(st);
        result.count++;
      } else if (st.sh !== undefined) {
        // ツアーのようにカードで公演が並ぶページは、開演時刻しか載っていない(開場時刻は手入力)
        const sh = String(st.sh).padStart(2, '0');
        eventShowtimeInput.value = '開演 ' + sh + ':' + st.sm;
        startHourSelect.value = sh;
        startMinuteSelect.value = st.sm;
        result.count++;
        result.startOnly = true;
      } else {
        eventShowtimeInput.value = '';
      }

      if (st.venue) {
        eventVenueInput.value = st.venue;
        result.count++;
      }

      groupSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
      st.artists.forEach(function (name) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        groupSelect.appendChild(opt);
      });
      if (st.artists.length > 0) {
        groupSelect.style.display = 'block';
        // 一番上をデフォルトで選択(必要なら自分で変更する)
        groupInput.value = st.artists[0];
        groupSelect.value = st.artists[0];
        result.count++;
        if (st.artists.length > 1) result.multiArtists = true;
      } else {
        groupSelect.style.display = 'none';
        groupInput.value = '';
      }
      return result;
    }

    const START_ONLY_NOTE = '開場時刻はページに載っていません。「開場/開演」のところで開場の時刻を選んで「この時刻を反映」を押してください。';
    stageSelect.addEventListener('change', function () {
      const r = applyStage(Number(stageSelect.value));
      goLink.classList.add('disabled');
      if (r.startOnly) fetchStatus.textContent = START_ONLY_NOTE;
    });

    // 「日時」ラベルの隣などのspanの文字から、1つの公演の情報を読み取る
    function parseStageEls(dateEl, venueEl, castEl) {
      const t = dateEl ? dateEl.textContent : '';
      const dm = t.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})(?:\(([^)]+)\))?/);
      if (!dm) return null;
      const tm = t.match(/開場時刻\s*(\d{1,2}):(\d{2})[\s\S]*?開演時刻\s*(\d{1,2}):(\d{2})/);
      const st = {
        y: dm[1], m: dm[2], d: dm[3], weekday: dm[4] || '',
        venue: venueEl ? venueEl.textContent.trim() : '',
        artists: artistsFromCast(castEl)
      };
      if (tm) { st.oh = tm[1]; st.om = tm[2]; st.sh = tm[3]; st.sm = tm[4]; }
      return st;
    }

    function stageLabel(st) {
      const wd = st.weekday ? '(' + st.weekday + ')' : '';
      let s = (st.name ? st.name + '  ' : '') + st.y + '/' + st.m + '/' + st.d + wd;
      if (st.oh !== undefined) s += '  開場 ' + parseInt(st.oh, 10) + ':' + st.om + ' / 開演 ' + parseInt(st.sh, 10) + ':' + st.sm;
      else if (st.sh !== undefined) s += '  開演 ' + parseInt(st.sh, 10) + ':' + st.sm;
      if (st.status) s += '  [' + st.status + ']';
      return s;
    }

    // 「出演」欄の中から、アーティスト名を取り出す(名前用のクラスがなければ、リンクの文字を使う)
    function artistsFromCast(castEl) {
      if (!castEl) return [];
      let els = Array.from(castEl.querySelectorAll('.EventInfoUnit_artistName__QVRvS'));
      if (els.length === 0) els = Array.from(castEl.querySelectorAll('a'));
      return els.map(function (el) { return el.textContent.trim(); })
        .filter(function (x, idx, arr) { return x && arr.indexOf(x) === idx; });
    }

    // ---- 公演の一覧が「カード」で並ぶタイプ(ツアーなど)への対応 ----
    // 各カードの文字が「9.24」「17:00」「受付終了」「東京公演」「Zepp DiverCity」の順に並ぶ。
    // 年は載っていないので、先頭の「公演日時」の開始日から補う(年をまたぐツアーは翌年にする)
    function collectTexts(node, out) {
      if (!node) return out;
      if (node.nodeType === 3) {
        const t = (node.textContent || '').trim();
        if (t) out.push(t);
        return out;
      }
      if (node.nodeType !== 1) return out;
      const tag = (node.tagName || '').toUpperCase();
      if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'NOSCRIPT') return out;
      const kids = node.childNodes || [];
      for (let i = 0; i < kids.length; i++) collectTexts(kids[i], out);
      return out;
    }

    function parseStageCards(doc, baseYear, baseMonth, headerVenueEl, headerCastEl) {
      const texts = collectTexts(doc.body, []);
      const dateRe = /^(\d{1,2})\.(\d{1,2})$/;
      const timeRe = /^(\d{1,2}):(\d{2})$/;
      const statusRe = /受付|販売|完売|抽選/;
      const cast = artistsFromCast(headerCastEl);
      const headerVenue = headerVenueEl ? headerVenueEl.textContent.trim() : '';
      const out = [];
      for (let i = 0; i < texts.length - 1; i++) {
        const dm = dateRe.exec(texts[i]);
        const tm = timeRe.exec(texts[i + 1]);
        if (!dm || !tm) continue;
        const month = Number(dm[1]), day = Number(dm[2]);
        if (month < 1 || month > 12 || day < 1 || day > 31) continue;
        let j = i + 2;
        let status = '';
        if (j < texts.length && statusRe.test(texts[j])) { status = texts[j]; j++; }
        let name = '', venue = '';
        if (j < texts.length && !dateRe.test(texts[j])) { name = texts[j]; j++; }
        if (j < texts.length && !dateRe.test(texts[j])) { venue = texts[j]; j++; }
        const year = month < baseMonth ? baseYear + 1 : baseYear;
        out.push({
          y: String(year), m: String(month), d: String(day),
          weekday: weekdayKanji[new Date(year, month - 1, day).getDay()],
          sh: tm[1], sm: tm[2],
          name: name, status: status,
          venue: venue || headerVenue, artists: cast
        });
        i = j - 1;
      }
      return out;
    }

    async function runFetch() {
      const url = eventUrlInput.value.trim();
      if (!url) {
        fetchStatus.textContent = 'URLを入力してください';
        return;
      }

      fetchStatus.textContent = '取得中…';

      // 前回の取得結果を一旦リセットしてから取得し直す
      eventTitleInput.value = '';
      eventTicketTypeInput.value = '';
      ticketTypeSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
      ticketTypeSelect.value = '';
      ticketTypeSelect.style.display = 'none';
      ticketPrefixMap = {};
      stagesData = [];
      stageSelect.innerHTML = '';
      stageRow.style.display = 'none';
      groupInput.value = '';
      groupSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
      groupSelect.value = '';
      groupSelect.style.display = 'none';
      eventDateInput.value = '';
      eventShowtimeInput.value = '';
      eventImageInput.value = '';
      updateImagePreview();
      eventVenueInput.value = '';

      let doc = null;
      let fetchError = null;
      let timedOut = false;

      // 複数の取得方法を順番に試す(1つ失敗しても次を試す)
      const attempts = [
        function (signal) { return fetch('https://nakao.n90910syu.workers.dev/?url=' + encodeURIComponent(url), { signal: signal }); },
        function (signal) { return fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(url), { signal: signal }); },
        function (signal) { return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), { signal: signal }); },
        function (signal) { return fetch(url, { signal: signal }); }
      ];

      // ここから5秒経ったら、まだ試していない方法があっても打ち切る
      const deadline = Date.now() + 5000;

      function timeoutRejection(ms) {
        return new Promise(function (_, reject) {
          setTimeout(function () { reject(new Error('timeout')); }, ms);
        });
      }

      for (const attempt of attempts) {
        const remaining = deadline - Date.now();
        if (remaining <= 0) {
          timedOut = true;
          break;
        }
        const controller = new AbortController();
        const abortTimer = setTimeout(function () { controller.abort(); }, remaining);
        try {
          // fetchが実際には止まらないケースもあるので、時間切れになったら
          // fetchの完了を待たずに強制的に先へ進む
          const response = await Promise.race([
            attempt(controller.signal),
            timeoutRejection(remaining)
          ]);
          if (!response.ok) {
            throw new Error('ネットワークエラー: ' + response.status);
          }
          const html = await Promise.race([response.text(), timeoutRejection(Math.max(deadline - Date.now(), 0))]);
          if (!html || html.length < 100) {
            throw new Error('取得内容が空でした');
          }
          doc = new DOMParser().parseFromString(html, 'text/html');
          fetchError = null;
          clearTimeout(abortTimer);
          break;
        } catch (err) {
          if (err && (err.name === 'AbortError' || err.message === 'timeout')) {
            timedOut = true;
          }
          fetchError = err;
        } finally {
          clearTimeout(abortTimer);
        }
      }

      // 取得できなかった項目は空欄のまま(既存の入力があれば消さない)。
      // 取れた項目だけ、その項目の欄に反映する。
      let gotCount = 0;
      let multiChoiceNote = ''; // 候補が複数あって一番上を自動選択した項目名
      let prefixNote = '';      // 整理番号の接頭辞を取得できたか(画面に表示する)
      let stageNote = '';       // 公演(日程)が複数見つかったときの案内
      let startOnlyNote = '';   // 開場時刻が取れなかったときの案内

      if (doc) {
        // イベント名: ページの<title>(「イベント名 | TicketDive」)が、チケットに出るイベント名と同じ。
        // 公演(日程)が複数あるページでは、見出しのクラスが公演ごとの名前(【10月2日】…)になるため、<title>を優先する。
        let eventName = '';
        const titleTag = doc.querySelector('title');
        if (titleTag) eventName = titleTag.textContent.replace(/\s*\|\s*TicketDive\s*$/, '').trim();
        if (!eventName) {
          const titleEl = doc.querySelector('.EventInfoUnit_name__P2ZEy');
          if (titleEl) eventName = titleEl.textContent.trim();
        }
        if (eventName) {
          eventTitleInput.value = eventName;
          gotCount++;
        }

        // 公演(日程)・会場・出演者: ラベル(「日時」「公演日時」「会場」「出演」)のすぐ隣のspanから取る。
        //   ・1公演だけのページ: 先頭の「公演日時」に、日付と開場・開演の時刻がまとまっている
        //   ・複数公演のページ: 先頭の「公演日時」は日付の範囲だけ。公演ごとに「日時」「会場」「出演」が並ぶ
        const infoSpans = Array.from(doc.querySelectorAll('span.Typography_root__9AOcJ'));
        const nextOf = function (el) { return el && el.nextElementSibling ? el.nextElementSibling : null; };
        const rawStages = [];
        let cur = null;
        let headerDateEl = null, headerVenueEl = null, headerCastEl = null;
        infoSpans.forEach(function (el) {
          const t = el.textContent.trim();
          if (t === '日時') {
            cur = { dateEl: nextOf(el), venueEl: null, castEl: null };
            rawStages.push(cur);
          } else if (t === '会場') {
            if (cur) { if (!cur.venueEl) cur.venueEl = nextOf(el); }
            else if (!headerVenueEl) headerVenueEl = nextOf(el);
          } else if (t === '出演') {
            if (cur) { if (!cur.castEl) cur.castEl = nextOf(el); }
            else if (!headerCastEl) headerCastEl = nextOf(el);
          } else if (t === '公演日時' && !headerDateEl) {
            headerDateEl = nextOf(el);
          }
        });

        let parsed = rawStages.map(function (s) {
          return parseStageEls(s.dateEl, s.venueEl || headerVenueEl, s.castEl || headerCastEl);
        }).filter(Boolean);

        // 公演がカードで並ぶタイプ(ツアーなど): 先頭の「公演日時」(例: 2026/9/24(木)〜12/7(月))から年と開始月を補う
        if (parsed.length === 0) {
          const hd = headerDateEl ? headerDateEl.textContent.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/) : null;
          const baseYear = hd ? Number(hd[1]) : new Date().getFullYear();
          const baseMonth = hd ? Number(hd[2]) : 1;
          parsed = parseStageCards(doc, baseYear, baseMonth, headerVenueEl, headerCastEl);
        }

        if (parsed.length === 0) {
          // 「日時」ラベルの公演もカードもない: 1公演だけのページ(先頭の「公演日時」)、
          // それも見つからなければ、日付と「開場時刻」の文字を含むspanを探す
          let dateEl = headerDateEl;
          if (!dateEl) {
            dateEl = infoSpans.find(function (el) {
              const t = el.textContent;
              return /\d{4}\/\d{1,2}\/\d{1,2}/.test(t) && t.includes('開場時刻');
            }) || null;
          }
          const one = parseStageEls(dateEl, headerVenueEl, headerCastEl);
          if (one) parsed = [one];
        }

        // 同じ日付・時刻の公演はまとめる(3日通し券は、初日と同じ内容が表示されるため)
        const seenStage = {};
        stagesData = parsed.filter(function (st) {
          const key = stageLabel(st);
          if (seenStage[key]) return false;
          seenStage[key] = true;
          return true;
        });

        // 出演者が公演から取れなかったときの予備: ページ内のアーティスト名をすべて
        const allArtists = Array.from(doc.querySelectorAll('.EventInfoUnit_artistName__QVRvS'))
          .map(function (el) { return el.textContent.trim(); })
          .filter(function (x, idx, arr) { return x && arr.indexOf(x) === idx; });
        stagesData.forEach(function (st) { if (st.artists.length === 0) st.artists = allArtists; });

        stageSelect.innerHTML = '';
        stagesData.forEach(function (st, i) {
          const opt = document.createElement('option');
          opt.value = String(i);
          opt.textContent = stageLabel(st);
          stageSelect.appendChild(opt);
        });
        stageRow.style.display = stagesData.length > 1 ? 'block' : 'none';

        // 一番上の公演をデフォルトで選択して、日付・時刻・会場・出演者を反映する(変更は「公演(日程)」で)
        const applied = applyStage(0);
        gotCount += applied.count;
        if (applied.multiArtists) multiChoiceNote += 'お目当てのグループ';
        if (applied.startOnly) startOnlyNote = START_ONLY_NOTE;
        if (stagesData.length > 1) {
          stageNote = '公演(日程)が' + stagesData.length + '件見つかりました。一番上を自動で選択しています。違う場合は「公演(日程)」のプルダウンで変更してください。';
        }

        // 画像URL: EventImage_image__8JwBv というクラスのimgタグから、
        // Next.jsの画像最適化用URL(/_next/image?url=...)に包まれた本来の画像URLを取り出す
        const imgEl = doc.querySelector('.EventImage_image__8JwBv');
        let imageUrl = '';
        if (imgEl) {
          const rawSrc = imgEl.getAttribute('src') || '';
          const urlMatch = rawSrc.match(/[?&]url=([^&]+)/);
          if (urlMatch) {
            imageUrl = decodeURIComponent(urlMatch[1]);
          } else if (rawSrc) {
            imageUrl = rawSrc;
          }
        }
        if (imageUrl) {
          eventImageInput.value = imageUrl;
          updateImagePreview();
          gotCount++;
        }

        // チケット種別: TicketTypeCard_ticketTypeContainer__ssRda というカードが種別の数だけ並んでいる。
        // それぞれの中の、一番最初のspan(価格の前にある名前部分)を取り出す
        const ticketTypeContainers = doc.querySelectorAll('.TicketTypeCard_ticketTypeContainer__ssRda');
        let ticketNames = Array.from(ticketTypeContainers)
          .map(function (container) {
            const nameEl = container.querySelector('span.Typography_root__9AOcJ');
            return nameEl ? nameEl.textContent.trim() : '';
          })
          .filter(function (t, idx, arr) {
            return t && arr.indexOf(t) === idx; // 重複除去
          });

        // 予備: 複数公演のページなどでは、チケット種別の一覧が最初は画面に出ていない(「選択する」を押した後に出る)。
        // そのときは、ページに埋め込まれたデータの中の「名前と接頭辞を持つ項目」(=チケット種別)を使う。
        const prefixPairs = extractPrefixPairs(doc);
        let ticketFromData = false;
        if (ticketNames.length === 0) {
          ticketNames = prefixPairs
            .map(function (p) { return p.name; })
            .filter(function (n, idx, arr) { return n && arr.indexOf(n) === idx; });
          ticketFromData = ticketNames.length > 0;
        }

        ticketTypeSelect.innerHTML = '<option value="">-- 候補から選ぶ --</option>';
        ticketNames.forEach(function (name) {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          ticketTypeSelect.appendChild(opt);
        });

        if (ticketNames.length > 0) {
          ticketTypeSelect.style.display = 'block';
        } else {
          ticketTypeSelect.style.display = 'none';
        }

        if (ticketNames.length > 0) {
          // 一番上をデフォルトで選択(必要なら自分で変更する)
          eventTicketTypeInput.value = ticketNames[0];
          ticketTypeSelect.value = ticketNames[0];
          gotCount++;
          if (ticketNames.length > 1) {
            multiChoiceNote += (multiChoiceNote ? '・' : '') + 'チケット種別';
          }
        }

        // チケット種別ごとの整理番号の接頭辞を取得して、今選んでいるチケット種別の分を整理番号に反映する
        ticketPrefixMap = buildPrefixMap(prefixPairs, ticketNames);
        const prefixEntries = Object.keys(ticketPrefixMap);
        if (prefixEntries.length > 0) {
          prefixNote = '整理番号の接頭辞: ' + prefixEntries.map(function (n) { return n + '=' + ticketPrefixMap[n]; }).join(' / ')
            + (ticketFromData ? '\n(チケット種別は、ページ内のデータから取得しました)' : '');
          syncPrefixWithTicketType();
        } else if (ticketNames.length > 0) {
          prefixNote = '整理番号の接頭辞は取得できませんでした。手入力してください。';
        } else {
          prefixNote = 'チケット種別と整理番号の接頭辞は取得できませんでした。手入力してください。';
        }
      }

      if (doc) {
        fetchStatus.textContent = gotCount + '件の項目を取得しました(5秒以内に取得できた分のみ反映)。空欄が残っていれば手入力してください。'
          + (multiChoiceNote ? '\n' + multiChoiceNote + 'は一番上を自動で選択しています。違う場合はプルダウンで変更してください。' : '')
          + (stageNote ? '\n' + stageNote : '')
          + (startOnlyNote ? '\n' + startOnlyNote : '')
          + (prefixNote ? '\n' + prefixNote : '');
      } else if (timedOut) {
        fetchStatus.textContent = '5秒以内に取得できませんでした。空欄の項目は手入力してください。';
      } else if (fetchError) {
        fetchStatus.textContent = '取得できませんでした(' + fetchError.message + ')。空欄の項目は手入力してください。';
      } else {
        fetchStatus.textContent = 'ページは取得できましたが、対象の情報が見つかりませんでした。手入力してください。';
      }
    }

    fetchBtn.addEventListener('click', function () {
      const startedAt = Date.now();
      let finished = false;

      // 経過秒数を表示して、止まっていないことが分かるようにする
      const tick = setInterval(function () {
        if (finished) return;
        const sec = ((Date.now() - startedAt) / 1000).toFixed(1);
        fetchStatus.textContent = '取得中… ' + sec + '秒(最大5秒)';
      }, 200);

      // 何があっても6秒で必ず打ち切って表示を戻す(最後の砦)
      const watchdog = setTimeout(function () {
        if (finished) return;
        finished = true;
        clearInterval(tick);
        fetchStatus.textContent = '6秒経過したため打ち切りました。取得できていない項目は手入力してください。';
      }, 6000);

      runFetch()
        .catch(function (err) {
          if (finished) return;
          fetchStatus.textContent = 'エラーが発生しました: ' + (err && err.message ? err.message : err);
        })
        .finally(function () {
          finished = true;
          clearInterval(tick);
          clearTimeout(watchdog);
          unmarkFilled(); // 取得で埋まった欄の赤枠を外す
        });
    });

    // 保存前に必ず入力されているべき項目(画面の上から順)
    const requiredFields = [
      { el: nameInput, label: '氏名' },
      { el: eventTitleInput, label: 'イベントタイトル' },
      { el: groupInput, label: 'お目当てのグループ' },
      { el: eventTicketTypeInput, label: 'チケット種別' },
      // 「S-」「A-」のように接頭辞だけで、番号(数字)がないものは未入力として扱う
      { el: input, label: '整理番号', isEmpty: function (v) { return !/[0-9]/.test(v); } },
      { el: eventDateInput, label: '日時' },
      // 開場と開演の時刻が両方そろっていないものは未入力として扱う(開演だけの取得結果のとき、開場を手入力させるため)
      { el: eventShowtimeInput, label: '開場/開演', isEmpty: function (v) { return !(/開場\s*\d+:\d+/.test(v) && /開演\s*\d+:\d+/.test(v)); } },
      { el: eventImageInput, label: '画像URL' },
      { el: eventVenueInput, label: '会場名' }
    ];

    function isFieldEmpty(f) {
      const v = f.el.value.trim();
      return f.isEmpty ? f.isEmpty(v) : v === '';
    }

    // 入力し終わった欄の赤枠は外す
    function unmarkFilled() {
      requiredFields.forEach(function (f) {
        if (f.el.classList.contains('invalid') && !isFieldEmpty(f)) {
          f.el.classList.remove('invalid');
        }
      });
    }
    ['input', 'change', 'click'].forEach(function (evt) {
      document.addEventListener(evt, function () { setTimeout(unmarkFilled, 0); });
    });

    saveAllBtn.addEventListener('click', function () {
      const missing = requiredFields.filter(isFieldEmpty);
      requiredFields.forEach(function (f) { f.el.classList.remove('invalid'); });
      if (missing.length > 0) {
        missing.forEach(function (f) { f.el.classList.add('invalid'); });
        goLink.classList.add('disabled');
        alert('未入力項目があります。\n\n' + missing.map(function (f) { return '・' + f.label; }).join('\n') + '\n\n赤くなっている欄を入力してから、もう一度保存してください。');
        if (missing[0].el.scrollIntoView) missing[0].el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      localStorage.setItem('userInput', input.value.trim());
      localStorage.setItem('userName', nameInput.value.trim());
      localStorage.setItem('userGroup', groupInput.value.trim());

      localStorage.setItem('eventTitle', eventTitleInput.value.trim());
      localStorage.setItem('eventDate', eventDateInput.value.trim());
      localStorage.setItem('eventShowtime', eventShowtimeInput.value.trim());
      localStorage.setItem('eventImage', eventImageInput.value.trim());
      localStorage.setItem('eventVenue', eventVenueInput.value.trim());
      localStorage.setItem('eventTicketType', eventTicketTypeInput.value.trim());

      // 新しく保存したら、詳細ページの「入場済み」状態は解除して、最初から試せるようにする
      localStorage.removeItem('ticketEnteredAt');
      localStorage.removeItem('ticketColorOverride');
      localStorage.removeItem('ticketReferenceOverride');

      goLink.classList.remove('disabled');

      alert('保存しました');
    });

    // 保存後に何かの入力欄が変更されたら、再度保存するまでGOを無効化する
    const allInputs = [
      input, nameInput, groupInput,
      eventUrlInput, eventTitleInput, eventTicketTypeInput,
      eventDateInput, eventShowtimeInput, eventImageInput,
      eventVenueInput
    ];
    allInputs.forEach(function (el) {
      if (!el) return;
      el.addEventListener('input', function () {
        goLink.classList.add('disabled');
      });
    });
  </script>

</body></html>
